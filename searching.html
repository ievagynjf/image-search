<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>正在准备搜索</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('image-search-theme')==='dark'?'dark':'light';}catch(e){}</script>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--tx:#202631;--mu:#687283;--accent:#3976ec;--track:#dfe7f6}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161e;--tx:#e8edf5;--mu:#a8b4c7;--accent:#88adff;--track:#293342}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif}
main{text-align:center;max-width:420px}
.spinner{width:42px;height:42px;margin:0 auto 28px;border:3px solid var(--track);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
h1{font-size:19px;font-weight:600;margin:0 0 12px}
p{font-size:13px;color:var(--mu);line-height:1.8;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<main role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <h1 id="heading">正在准备搜索</h1>
  <p id="status">图片处理完成后将自动打开搜索结果</p>
</main>
<script>
var engine={lens:'Lens',tineye:'TinEye',yandex:'Yandex'}[new URLSearchParams(location.search).get('engine')];
if(engine){document.getElementById('heading').textContent='正在准备 '+engine+' 搜索';document.title='正在准备 '+engine+' 搜索';}
setTimeout(function(){document.getElementById('status').textContent='图片仍在处理中，请保持原页面打开';},12000);
</script>
</body>
</html>
