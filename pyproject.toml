[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[project]
name = "cross-market-research"
version = "0.2.0"
description = "Read-only product discovery and price evidence bridge"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "fastmcp>=2,<3"]
[project.optional-dependencies]
tinyfish = ["tinyfish>=0.4,<1"]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["."]
include = ["research_bridge*"]